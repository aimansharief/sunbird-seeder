image:
  repository: ghcr.io/aimansharief/sunbird-seeder
  tag: latest
  pullPolicy: Always
imagePullSecrets: []          # ghcr packages are private by default: add a pull secret or make the package public

# Secret holding the .env keys (see .env.example). Create it yourself, it is never in the chart:
#   kubectl -n sunbird create secret generic seeder-env --from-env-file=.env
existingSecret: seeder-env

# Config files baked into the image (paths relative to /app). To change them: edit, push, wait
# for the new image, then install with --set image.tag=sha-<commit>.
benchFile: config/bench.cluster.yaml
volumesFile: config/volumes.cluster.yaml

workers: 1                    # JMeter workers: `seeder export --workers`
holdAfterDoneSeconds: 3600    # keep the pod alive after export so `kubectl cp` works from it

pvc:
  size: 3Gi
  storageClassName: ""        # empty = cluster default (Azure Disk, RWO)

backoffLimit: 30              # restarts after a crash or failed stage; seeder resumes from SQLite

resources:
  requests: {cpu: 500m, memory: 2Gi}
  limits: {cpu: "2", memory: 4Gi}

# Throwaway pod that mounts the PVC so you can `kubectl cp` after the Job has exited.
# Turn on with `helm upgrade --reuse-values --set reader.enabled=true`, off again the same way.
reader:
  enabled: false
  ttlSeconds: 3600
