apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}
spec:
  backoffLimit: {{ .Values.backoffLimit }}
  template:
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsUser: 1000
        fsGroup: 1000
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: seeder
          image: {{ .Values.image.repository }}:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: [sh, -c]
          args:
            - >-
              S="seeder --env {{ .Values.benchFile }} --volumes {{ .Values.volumesFile }}";
              $S seed all &&
              { $S verify || echo "verify found gaps, exporting anyway"; } &&
              $S export --workers {{ .Values.workers }} &&
              sleep {{ .Values.holdAfterDoneSeconds }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          resources: {{ toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - {name: output, mountPath: /app/output}
      volumes:
        - name: output
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-output
