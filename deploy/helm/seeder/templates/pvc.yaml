apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-output
  annotations:
    helm.sh/resource-policy: keep   # SQLite state and CSVs survive `helm uninstall`
spec:
  accessModes: [ReadWriteOnce]
  {{- with .Values.pvc.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.pvc.size }}
