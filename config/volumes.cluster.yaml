run_id: spark03

users: 100000
contents: 10000
mp4_ratio: 0.4              # share of contents that are videos; the rest are PDFs (deterministic per run_id)
courses: 1050
contents_per_course: 5
units_per_course: 2
users_per_batch: 500        # one batch per course -> 1050 x 500 = 525,000 enrolments


