# Environment settings. Secrets come from .env, not this file.
mode: public                  # public = via Kong (endpoints); local = internal services (local)
base_url: https://your-spark-host
output_root: output

channel: your-channel-id
root_org_id: your-root-org-id
custodian_channel: your-custodian-channel  # channel *name* sent on user create
framework: your-framework-id
email_domain: bench.example.com

# Login = Keycloak grant -> refresh_token -> endpoints.refresh_token -> access token.
keycloak:
  url: https://your-spark-host/auth
  realm: sunbird
  admin_client_id: lms        # VERIFY: client used for the admin grant
  admin_grant_type: password
  user_client_id: android     # VERIFY: client used for learner password grants

# Headers sent on every request.
extra_headers:
  X-Channel-Id: your-channel-id

concurrency: 10               # parallel requests while seeding
token_concurrency: 20
request_timeout_s: 30
retries: 4

publish_poll:
  interval_s: 10
  timeout_s: 1800

enrol_as: user                # user = learner's own token; admin = admin token

# "METHOD /path". {id} is replaced at call time.
# VERIFY every entry against your Spark deployment before the first run.
endpoints:
  refresh_token:      POST /auth/v1/refresh/token
  user_create:        POST /api/user/v1/create
  user_search:        POST /api/user/v1/search
  content_create:     POST /api/content/v1/create
  content_upload:     POST /api/content/v1/upload/{id}
  content_review:     POST /api/content/v1/review/{id}
  content_publish:    POST /api/content/v1/publish/{id}
  content_read:       GET  /api/content/v1/read/{id}
  content_retire:     DELETE /api/content/v1/retire/{id}
  course_create:      POST /api/collection/v1/create
  course_hierarchy:   PATCH /api/collection/v1/hierarchy/update
  course_review:      POST /api/collection/v1/review/{id}
  course_publish:     POST /api/collection/v1/publish/{id}
  course_read:        GET  /api/collection/v1/read/{id}
  course_retire:      DELETE /api/collection/v1/retire/{id}
  batch_create:       POST /api/course/v1/batch/create
  enrol:              POST /api/course/v1/enrol

# Used when mode: local. Calls go straight to each service, without Kong or the
# API key. user_token: true sends the admin's x-authenticated-user-token.
# Login (Keycloak + refresh_token) always uses the public routes above.
# VERIFY hosts and paths against your Spark deployment.
local:
  hosts:
    userorg: http://userorg-service:9000
    content: http://content-service:9000
    lms: http://lms-service:9000
  endpoints:
    user_create:      {route: "POST {userorg}/v1/user/create", user_token: true}
    user_search:      {route: "POST {userorg}/v1/user/search", user_token: true}
    content_create:   {route: "POST {content}/content/v3/create"}
    content_upload:   {route: "POST {content}/content/v3/upload/{id}"}
    content_review:   {route: "POST {content}/content/v3/review/{id}"}
    content_publish:  {route: "POST {content}/content/v3/publish/{id}"}
    content_read:     {route: "GET {content}/content/v3/read/{id}"}
    content_retire:   {route: "DELETE {content}/content/v3/retire/{id}"}
    course_create:    {route: "POST {content}/collection/v4/create"}
    course_hierarchy: {route: "PATCH {content}/collection/v4/hierarchy/update"}
    course_review:    {route: "POST {content}/collection/v4/review/{id}"}
    course_publish:   {route: "POST {content}/collection/v4/publish/{id}"}
    course_read:      {route: "GET {content}/collection/v4/read/{id}"}
    course_retire:    {route: "DELETE {content}/collection/v4/retire/{id}"}
    batch_create:     {route: "POST {lms}/v1/course/batch/create", user_token: true}
    enrol:            {route: "POST {lms}/v1/course/enroll", user_token: true}
